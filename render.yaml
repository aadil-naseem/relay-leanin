# Render blueprint for the RELAY backend.
#
# Render dashboard -> New -> Blueprint -> pick this repo. Set CORS_ORIGINS to the
# deployed frontend origin (comma-separate several, e.g. the Vercel production and
# preview domains). See docs/DEPLOY.md.
#
# The SQLite file is git-ignored, so the start command seeds the sample world on a
# fresh instance and leaves an existing database alone.
services:
  - type: web
    name: relay-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/ensure_demo_world.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: APP_ENV
        value: production
      - key: WEATHER_MODE
        value: replay
      # Set this in the dashboard: https://<your-frontend-domain>
      - key: CORS_ORIGINS
        sync: false
